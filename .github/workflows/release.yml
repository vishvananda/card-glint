name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact verified main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/verified-release.mjs
      - name: Select verified immutable release artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-artifacts.mjs dist/releases
      - name: Publish immutable CDN tree
        run: node scripts/publish-cdn.mjs dist/releases
      - name: Publish checked packages
        if: steps.artifacts.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/releases/* \
            --verify-tag --title "card-glint $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$VERSION.md"
