name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  font-geometry:
    uses: ./.github/workflows/font-geometry.yml
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-${{ runner.os }}-0.2.127
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
        if: steps.bindgen.outputs.cache-hit != 'true'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run magic:data:check
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-build
          retention-days: 14
          overwrite: true
          path: |
            dist/lib/
            dist/types/
            dist/lab/
            dist/releases/*.tgz
            dist/releases/*.zip
            dist/releases/release.json
            dist/releases/SHA256SUMS
            packages/browser/generated/
            games/magic/src/data/
      - name: Upload showcase
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/lab
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: renderer-build
          path: .
      - name: Use primary Ubuntu archive for browser dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$source"
            fi
          done
      - run: npx playwright install --with-deps chromium webkit
      - name: Start preview
        run: |
          npm run preview -- --strictPort > /tmp/card-glint-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4283/card-glint/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/card-glint-preview.log
          exit 1
      - name: Verify shard
        run: npm run test:ci -- --shards 4 --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-times-${{ matrix.shard }}
          path: evidence/ci-times-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-evidence-${{ matrix.shard }}
          path: evidence/
  # Preserve the required check name and require every shard to succeed.
  renderer:
    if: always()
    needs: [build, verify, font-geometry]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          pattern: ci-times-*
          merge-multiple: true
          path: ci-results
      - name: Check complete test coverage and report timing
        if: needs.build.result == 'success'
        run: node scripts/ci/report.mjs --results ci-results --shards 4
      - name: Require successful build and every verification job
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          FONT_RESULT: ${{ needs.font-geometry.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$FONT_RESULT" = success
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v5
