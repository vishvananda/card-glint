name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-${{ runner.os }}-0.2.127
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
        if: steps.bindgen.outputs.cache-hit != 'true'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:package
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview > /tmp/card-glint-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4283/card-glint/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/card-glint-preview.log
          exit 1
      - run: npm run test:browser
      - run: npm run test:showcase
      - run: npm run test:surfaces
      - run: npm run test:touch
      - run: npm run package:release
      - run: npm run test:release
      - run: npm run test:cdn-publish
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-packages
          path: |
            dist/releases/*.tgz
            dist/releases/*.zip
            dist/releases/release.json
            dist/releases/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-evidence
          path: evidence/
      - name: Upload showcase
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/lab
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v5
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-packages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish immutable CDN tree
        run: node scripts/publish-cdn.mjs release-packages
      - name: Publish checked packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-packages/* \
            --verify-tag --title "card-glint $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$VERSION.md"
