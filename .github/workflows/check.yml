name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-${{ runner.os }}-0.2.127
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
        if: steps.bindgen.outputs.cache-hit != 'true'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:package
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview > /tmp/card-glint-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4283/card-glint/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/card-glint-preview.log
          exit 1
      - run: npm run test:browser
      - run: npm run test:showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-evidence
          path: evidence/
