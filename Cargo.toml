[workspace]
members = ["crates/renderer-core", "crates/renderer-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
renderer-core = { path = "crates/renderer-core" }
wasm-bindgen = "=0.2.127"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "forbid"
too_many_arguments = "forbid"
allow_attributes_without_reason = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
