<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>card-glint · browser package</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        color: #eadac1;
        background: #141923;
        text-align: center;
        font: 16px system-ui;
      }
      canvas {
        display: block;
        width: min(90vw, 360px);
        height: auto;
        margin: 24px auto;
      }
      a {
        color: #e9c98c;
      }
    </style>
  </head>
  <body>
    <h1>card-glint</h1>
    <p id="status">Loading the browser package…</p>
    <canvas
      id="card"
      width="720"
      height="1000"
      aria-label="An original card with interactive foil"
    ></canvas>
    <p><a href="https://github.com/vishvananda/card-glint">Source and documentation</a></p>
    <script type="module" src="./example.js"></script>
  </body>
</html>
